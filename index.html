<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Scanner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Bluetooth Device Found</h2>
            <p id="modal-device-name"></p>
            <p id="modal-device-id"></p>
            <p id="modal-device-signal"></p>
            <button id="connect-btn">Connect</button>
        </div>
    </div>
    <div class="container">
        <h1>Network Scanner</h1>
        <div class="scanner-grid">
            <!-- Network Analysis Panel -->
            <div class="panel" id="network-panel">
                <div class="panel-header">
                    <img src="wifi.png" alt="WiFi Icon" class="panel-icon">
                    <h2>Network Analysis</h2>
                </div>
                <div class="panel-controls">
                    <button id="analyze-network-btn">Analyze Network</button>
                    <p class="status" id="network-status">Status: Idle</p>
                </div>
                <ul class="results-list" id="network-results-list">
                    <!-- Network analysis results will be injected here -->
                </ul>
            </div>

            <!-- Bluetooth Panel -->
            <div class="panel" id="bluetooth-panel">
                <div class="panel-header">
                    <img src="bluetooth.png" alt="Bluetooth Icon" class="panel-icon">
                    <h2>Bluetooth Devices</h2>
                </div>
                <div class="panel-controls">
                    <button id="scan-bluetooth-btn">Find Device</button>
                    <p class="status" id="bluetooth-status">Status: Idle</p>
                </div>
                <ul class="results-list" id="bluetooth-list">
                    <!-- Bluetooth results will be injected here -->
                </ul>
            </div>
        </div>
    </div>
    <script type="module" src="script.js"></script>

</body>
</html>
